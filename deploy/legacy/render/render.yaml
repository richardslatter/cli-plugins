# Paid durable deployment. Apply after reviewing the compute and disk price.
services:
  - type: web
    name: cli-plugins
    runtime: docker
    region: singapore
    plan: starter
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    disk:
      name: cli-credentials
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=128
      - key: DATA_DIR
        value: /var/data
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: TEAMS_ACCOUNTS_JSON
        sync: false
      - key: GITHUB_ALLOWED_LOGINS
        sync: false
