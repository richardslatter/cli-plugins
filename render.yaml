# Deployment handoff only. Requires a connected Render account, an accessible
# private source repository, managed secret files, and explicit cost approval.
services:
  - type: web
    name: github-cli-native
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    numInstances: 1
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: 'off'
    disk:
      name: github-cli-encrypted-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: OWNER_EMAIL
        sync: false
      - key: BRIDGE_KEY_FILE
        value: /etc/secrets/bridge-key.b64
      - key: CREDENTIAL_KEY_FILE
        value: /etc/secrets/credential-key.b64
      - key: DATABASE_PATH
        value: /var/data/github-cli.sqlite
# Provision the two secret files through Render's secret manager before startup.
# Do not put their values into this YAML, the repository, prompts, or logs.
