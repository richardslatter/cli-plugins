app = "cli-plugins"
primary_region = "syd"
kill_signal = "SIGTERM"
kill_timeout = "15s"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  NODE_OPTIONS = "--max-old-space-size=128"
  DATA_DIR = "/var/data"
  PORT = "10000"
  PUBLIC_URL = "https://cli-plugins.fly.dev"

[[mounts]]
  source = "cli_credentials"
  destination = "/var/data"
  initial_size = "1gb"
  snapshot_retention = 5

[http_service]
  internal_port = 10000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
